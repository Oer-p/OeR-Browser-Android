
       name: Periksa AndroidManifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'android-app/app/src/main/AndroidManifest.xml'

          with open(path, 'rb') as f:
              data = f.read()

          print("Awal file:", repr(data[:20]))
          if data.startswith(b'\xef\xbb\xbf'):
              print("Ditemukan UTF-8 BOM")

          try:
              ET.fromstring(data)
              print("XML VALID")
          except ET.ParseError as e:
              print(f"XML ERROR: {e}")
              print(f"Baris: {e.position[0]}, kolom: {e.position[1]}")
              raise
          PY

      - name: Bangun APK OoeR
        run: gradle -p android-app assembleDebug --stacktrace
