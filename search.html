
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>OeR Search</title>

<style>
:root {
  --bg: #050505;
  --panel: #151515;
  --border: #303030;
  --text: #f5f5f5;
  --muted: #aaa;
  --green: #35d879;
  --blue: #8ab4f8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 17px 16px 8px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  text-align: center;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -2px;
  flex: 1;
  padding-left: 42px;
}

.logo .oer {
  color: white;
}

.logo .r {
  color: var(--green);
}

.account {
  width: 40px;
  height: 40px;
  border: 1px solid #444;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--green);
  text-decoration: none;
  font-size: 20px;
  flex-shrink: 0;
}

.search-box {
  margin: 18px 0 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #414141;
  background: var(--panel);
  border-radius: 28px;
  padding: 0 14px;
  min-height: 49px;
}

.search-icon {
  color: var(--muted);
  font-size: 18px;
}

#query {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  font-size: 16px;
  padding: 13px 0;
}

.action {
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 21px;
  padding: 5px;
  cursor: pointer;
}

.tabs-wrap {
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
}

.tabs-wrap::-webkit-scrollbar {
  display: none;
}

.tabs {
  display: flex;
  gap: 23px;
  padding: 8px 16px 0;
  width: max-content;
}

.tab {
  color: var(--muted);
  background: transparent;
  border: 0;
  padding: 10px 0 13px;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}

.tab.active {
  color: var(--green);
  border-bottom-color: var(--green);
}

main {
  padding: 18px 18px 35px;
}

.result-info {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 22px;
}

.result {
  margin-bottom: 27px;
  overflow-wrap: anywhere;
}

.result-url {
  color: #b8d9c5;
  font-size: 13px;
  margin-bottom: 7px;
}

.result-title {
  color: var(--blue);
  font-size: 19px;
  line-height: 1.35;
  text-decoration: none;
  display: block;
  margin-bottom: 7px;
}

.result-title:active {
  color: #c58af9;
}

.result-description {
  color: #c5c5c5;
  font-size: 14px;
  line-height: 1.6;
}

.empty {
  color: var(--muted);
  text-align: center;
  padding: 38px 12px;
  line-height: 1.7;
}

footer {
  border-top: 1px solid var(--border);
  padding: 18px;
  text-align: center;
  color: #777;
  font-size: 12px;
}

@media (min-width: 700px) {
  header {
    padding-left: 7%;
    padding-right: 7%;
  }

  main {
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }

  .logo {
    padding-left: 42px;
  }
}
</style>
</head>

<body>
<header>
  <div class="topbar">
    <div class="logo">
      <span class="oer">Oe</span><span class="r">R</span>
    </div>

    <a class="account" href="#" id="accountButton"
       aria-label="Akun pengguna" title="Akun">●</a>
  </div>

  <form id="searchForm" class="search-box">
    <span class="search-icon">⌕</span>

    <input
      id="query"
      type="search"
      placeholder="Cari di OeR..."
      autocomplete="off"
      aria-label="Kata pencarian"
    >

    <button type="button" class="action" id="clearButton"
            aria-label="Hapus pencarian">×</button>

    <button type="button" class="action" id="micButton"
            aria-label="Pencarian suara">🎙</button>

    <button type="submit" class="action"
            aria-label="Cari">➜</button>
  </form>
</header>

<nav class="tabs-wrap" aria-label="Kategori pencarian">
  <div class="tabs">
    <button class="tab active" data-mode="all">All</button>
    <button class="tab" data-mode="ai">AI Mode</button>
    <button class="tab" data-mode="web">Web</button>
    <button class="tab" data-mode="images">Gambar</button>
    <button class="tab" data-mode="videos">Video</button>
    <button class="tab" data-mode="news">Berita</button>
  </div>
</nav>

<main>
  <div id="resultInfo" class="result-info">
    Hasil pencarian OeR
  </div>

  <section id="results">
    <div class="empty">
      <div style="font-size:30px;color:#35d879">OeR</div>
      Ketik kata yang ingin kamu cari di kolom atas.<br>
      Hasil pencarian akan ditampilkan di sini.
    </div>
  </section>
</main>

<footer>
  OeR Search · Jelajahi pengetahuan
</footer>

<script>
const queryInput = document.getElementById("query");
const searchForm = document.getElementById("searchForm");
const clearButton = document.getElementById("clearButton");
const micButton = document.getElementById("micButton");
const results = document.getElementById("results");
const resultInfo = document.getElementById("resultInfo");
const tabs = document.querySelectorAll(".tab");

let currentMode = "all";

function getQuery() {
  return queryInput.value.trim();
}

function setQuery(value, runSearch = false) {
  queryInput.value = value;

  if (runSearch) {
    runSearchNow();
  }
}

function showEmpty(message) {
  results.replaceChildren();

  const box = document.createElement("div");
  box.className = "empty";
  box.textContent = message;

  results.appendChild(box);
}

function addResult(title, url, description) {
  const article = document.createElement("article");
  article.className = "result";

  const urlText = document.createElement("div");
  urlText.className = "result-url";
  urlText.textContent = url;

  const link = document.createElement("a");
  link.className = "result-title";
  link.textContent = title;
  link.href = url;

  const desc = document.createElement("div");
  desc.className = "result-description";
  desc.textContent = description;

  article.append(urlText, link, desc);
  results.appendChild(article);
}

function addGoogleSearch(query) {
  const params = new URLSearchParams({ q: query });

  let target = "https://www.google.com/search?" + params.toString();

  if (currentMode === "images") {
    target = "https://www.google.com/search?tbm=isch&q="
      + encodeURIComponent(query);
  } else if (currentMode === "videos") {
    target = "https://www.google.com/search?tbm=vid&q="
      + encodeURIComponent(query);
  } else if (currentMode === "news") {
    target = "https://news.google.com/search?q="
      + encodeURIComponent(query);
  } else if (currentMode === "ai") {
    target = "https://www.google.com/search?q="
      + encodeURIComponent(query + " AI overview");
  }

  addResult(
    "Lihat hasil web untuk: " + query,
    target,
    "Buka hasil pencarian web untuk menemukan situs, artikel, gambar, video, dan informasi yang berkaitan dengan kata kunci ini."
  );
}

function addOeRBenefitResult(query) {
  const normalized = query
    .toLocaleLowerCase("id")
    .replace(/[#_]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  const benefitWords = [
    "manfaat",
    "manfaat buah",
    "manfaat buah buahan",
    "khasiat",
    "khasiat buah",
    "kandungan buah"
  ];

  const fruitWords = [
    "apel", "pisang", "mangga", "jeruk", "pepaya",
    "semangka", "nanas", "alpukat", "anggur", "buah"
  ];

  const isBenefitSearch =
    benefitWords.some(word => normalized.includes(word)) ||
    (normalized.includes("manfaat") &&
     fruitWords.some(word => normalized.includes(word)));

  if (!isBenefitSearch) return;

  addResult(
    "Manfaat Buah — OeR",
    "https://oer-p.github.io/OeR-Browser-Android/manfaat.html",
    "Halaman informasi manfaat buah dan pengetahuan terkait di OeR."
  );
}

function runSearchNow() {
  const query = getQuery();

  if (!query) {
    resultInfo.textContent = "Hasil pencarian OeR";
    showEmpty("Ketik kata yang ingin kamu cari terlebih dahulu.");
    return;
  }

  resultInfo.textContent = 'Pencarian untuk "' + query + '"';
  results.replaceChildren();

  if (currentMode === "ai") {
    addResult(
      "AI Mode — OeR",
      "https://www.google.com/search?q=" +
        encodeURIComponent(query + " AI overview"),
      "Buka pencarian berbantuan AI melalui layanan web. Fitur AI khusus OeR memerlukan integrasi layanan AI."
    );
  } else {
    addOeRBenefitResult(query);
    addGoogleSearch(query);
  }

  const note = document.createElement("div");
  note.className = "result-description";
  note.style.marginTop = "22px";
  note.textContent =
    "Catatan: hasil web lengkap dibuka melalui mesin pencari. " +
    "Indeks internal OeR dapat ditambahkan untuk menampilkan lebih banyak halaman OeR.";
  results.appendChild(note);

  history.replaceState(
    null,
    "",
    location.pathname + "?q=" + encodeURIComponent(query) +
    "&mode=" + encodeURIComponent(currentMode)
  );
}

searchForm.addEventListener("submit", function(event) {
  event.preventDefault();
  runSearchNow();
});

clearButton.addEventListener("click", function() {
  queryInput.value = "";
  queryInput.focus();
  resultInfo.textContent = "Hasil pencarian OeR";
  showEmpty("Ketik kata yang ingin kamu cari di kolom atas.");
  history.replaceState(null, "", location.pathname);
});

tabs.forEach(tab => {
  tab.addEventListener("click", function() {
    tabs.forEach(item => item.classList.remove("active"));
    tab.classList.add("active");
    currentMode = tab.dataset.mode;

    if (getQuery()) {
      runSearchNow();
    } else {
      showEmpty("Ketik kata yang ingin kamu cari terlebih dahulu.");
    }
  });
});

micButton.addEventListener("click", function() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    showEmpty(
      "Pencarian suara belum didukung di lingkungan ini. " +
      "Silakan ketik kata yang ingin dicari."
    );
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "id-ID";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  micButton.textContent = "…";

  recognition.onresult = function(event) {
    queryInput.value = event.results[0][0].transcript;
    runSearchNow();
  };

  recognition.onerror = function() {
    showEmpty("Suara tidak berhasil dikenali. Silakan coba lagi.");
  };

  recognition.onend = function() {
    micButton.textContent = "🎙";
  };

  recognition.start();
});

document.getElementById("accountButton").addEventListener("click", function(event) {
  event.preventDefault();
  showEmpty(
    "Akun OeR akan dihubungkan ke sistem login yang tersedia di aplikasi."
  );
});

const params = new URLSearchParams(location.search);
const initialQuery = params.get("q") || "";
const initialMode = params.get("mode") || "all";

if (["all", "ai", "web", "images", "videos", "news"].includes(initialMode)) {
  currentMode = initialMode;

  tabs.forEach(tab => {
    tab.classList.toggle("active", tab.dataset.mode === currentMode);
  });
}

queryInput.value = initialQuery;

if (initialQuery) {
  runSearchNow();
}
</script>
</body>
</html>
